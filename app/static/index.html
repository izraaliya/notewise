<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NoteWise · AI Study Assistant</title>
<style>
  :root { --bg:#0f172a; --card:#1e293b; --muted:#94a3b8; --text:#e2e8f0; --accent:#38bdf8; --ok:#4ade80; --bad:#f87171; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--text); line-height:1.5; }
  main { max-width: 820px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { margin:0 0 4px; } .sub { color:var(--muted); margin:0 0 24px; }
  .card { background:var(--card); border-radius:12px; padding:20px; margin-bottom:16px; }
  textarea { width:100%; min-height:160px; border-radius:8px; border:1px solid #334155; background:#0b1220; color:var(--text); padding:12px; font:inherit; resize:vertical; }
  .row { display:flex; gap:12px; flex-wrap:wrap; align-items:center; margin-top:12px; }
  label { color:var(--muted); font-size:14px; }
  input, select { background:#0b1220; color:var(--text); border:1px solid #334155; border-radius:8px; padding:8px; font:inherit; }
  input[type=number] { width:64px; }
  button { background:var(--accent); color:#04263a; border:0; border-radius:8px; padding:10px 18px; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; cursor:wait; }
  .tabs button { background:transparent; color:var(--muted); padding:6px 12px; }
  .tabs button.active { color:var(--accent); border-bottom:2px solid var(--accent); border-radius:0; }
  .hidden { display:none; }
  .flash { perspective:800px; cursor:pointer; margin-bottom:10px; }
  .flash div { background:#0b1220; border:1px solid #334155; border-radius:8px; padding:14px; }
  .flash .a { color:var(--ok); }
  .opt { display:block; width:100%; text-align:left; background:#0b1220; color:var(--text); border:1px solid #334155; margin-top:6px; font-weight:400; }
  .opt.right { border-color:var(--ok); } .opt.wrong { border-color:var(--bad); }
  .expl { color:var(--muted); font-size:14px; margin-top:8px; }
  #error { color:var(--bad); }
</style>
</head>
<body>
<main>
  <h1>📚 NoteWise</h1>
  <p class="sub">Paste your notes or upload a PDF. Get a summary, flashcards and a quiz, powered by Gemini.</p>

  <div class="card">
    <div class="tabs row" style="margin-top:0">
      <button id="tabText" class="active" type="button">Paste text</button>
      <button id="tabPdf" type="button">Upload PDF</button>
    </div>
    <div id="textBox"><textarea id="text" placeholder="Paste at least 50 characters of notes…"></textarea></div>
    <div id="pdfBox" class="hidden" style="margin-top:12px"><input type="file" id="pdf" accept="application/pdf"></div>
    <div class="row">
      <label>Language <select id="lang"><option>English</option><option>Indonesian</option><option>Spanish</option><option>French</option></select></label>
      <label>Flashcards <input type="number" id="nf" value="6" min="1" max="15"></label>
      <label>Questions <input type="number" id="nq" value="4" min="1" max="10"></label>
      <button id="go" type="button">Generate</button>
    </div>
    <p id="error"></p>
  </div>

  <div id="result" class="hidden">
    <div class="card"><h2 id="title"></h2><p id="summary"></p><ul id="points"></ul></div>
    <div class="card"><h3>Flashcards <small style="color:var(--muted)">(click to reveal)</small></h3><div id="cards"></div></div>
    <div class="card"><h3>Quiz</h3><div id="quiz"></div></div>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
let mode = "text";
function setMode(m) {
  mode = m;
  $("tabText").classList.toggle("active", m === "text");
  $("tabPdf").classList.toggle("active", m === "pdf");
  $("textBox").classList.toggle("hidden", m !== "text");
  $("pdfBox").classList.toggle("hidden", m !== "pdf");
}
$("tabText").onclick = () => setMode("text");
$("tabPdf").onclick = () => setMode("pdf");

function el(tag, text, cls) { const e = document.createElement(tag); if (text !== undefined) e.textContent = text; if (cls) e.className = cls; return e; }

function render(p) {
  $("title").textContent = p.title;
  $("summary").textContent = p.summary;
  $("points").replaceChildren(...p.key_points.map(k => el("li", k)));
  $("cards").replaceChildren(...p.flashcards.map(c => {
    const box = el("div", undefined, "flash"), d = el("div");
    d.append(el("strong", c.question));
    const a = el("div", c.answer, "a"); a.classList.add("hidden"); a.style.marginTop = "8px";
    d.append(a); box.append(d); box.onclick = () => a.classList.toggle("hidden");
    return box;
  }));
  $("quiz").replaceChildren(...p.quiz.map((q, i) => {
    const wrap = el("div"); wrap.style.marginBottom = "18px";
    wrap.append(el("strong", `${i + 1}. ${q.question}`));
    const expl = el("div", q.explanation, "expl"); expl.classList.add("hidden");
    q.options.forEach((o, j) => {
      const b = el("button", o, "opt");
      b.onclick = () => {
        wrap.querySelectorAll(".opt").forEach((x, k) => { x.disabled = true; if (k === q.correct_index) x.classList.add("right"); });
        if (j !== q.correct_index) b.classList.add("wrong");
        expl.classList.remove("hidden");
      };
      wrap.append(b);
    });
    wrap.append(expl);
    return wrap;
  }));
  $("result").classList.remove("hidden");
}

$("go").onclick = async () => {
  $("error").textContent = "";
  $("go").disabled = true; $("go").textContent = "Thinking…";
  try {
    let res;
    if (mode === "text") {
      res = await fetch("/api/study-pack", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text: $("text").value, language: $("lang").value, num_flashcards: +$("nf").value, num_questions: +$("nq").value }) });
    } else {
      const f = $("pdf").files[0];
      if (!f) throw new Error("Choose a PDF first");
      const fd = new FormData();
      fd.append("file", f); fd.append("language", $("lang").value);
      fd.append("num_flashcards", $("nf").value); fd.append("num_questions", $("nq").value);
      res = await fetch("/api/study-pack/pdf", { method: "POST", body: fd });
    }
    const data = await res.json();
    if (!res.ok) throw new Error(typeof data.detail === "string" ? data.detail : "Please check your input");
    render(data);
  } catch (e) { $("error").textContent = e.message; }
  finally { $("go").disabled = false; $("go").textContent = "Generate"; }
};
</script>
</body>
</html>
